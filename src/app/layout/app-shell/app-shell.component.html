<vh-barre-progression />

<div class="coque">
  <a class="evitement" href="#contenu">Aller au contenu</a>

  <vh-navigation-laterale [entrees]="entrees()" [ouvert]="menuOuvert()" (fermer)="fermerMenu()" />

  @if (menuOuvert()) {
    <button class="voile" type="button" (click)="fermerMenu()" aria-label="Fermer le menu"></button>
  }

  <div class="principal">
    <!-- Fond vivant et trame derrière le contenu (skill « animations
         vivantes ») : les cartes sont opaques, ils ne se voient que dans les
         marges. -->
    <vh-fond-vivant class="fond-contenu" />
    <div class="trame-contenu vh-dot-grid-ink" aria-hidden="true"></div>

    <header class="entete">
      <button
        class="entete__menu"
        type="button"
        (click)="basculerMenu()"
        aria-label="Ouvrir le menu"
        aria-controls="navigation-principale"
        [attr.aria-expanded]="menuOuvert()"
      >
        <vh-icon nom="menu" />
      </button>

      <div class="entete__org">
        @if (organisations.chargement()) {
          <vh-skeleton largeur="140px" hauteur="1.1rem" />
        } @else if (organisations.organisation(); as org) {
          <span class="entete__nom">{{ org.name }}</span>
          @if (org.city) {
            <span class="entete__ville vh-muted">{{ org.city }}</span>
          }
        } @else if (organisations.erreur(); as message) {
          <span class="entete__erreur">{{ message }}</span>
        }
      </div>

      <button
        class="entete__theme"
        type="button"
        (click)="theme.basculer()"
        [attr.aria-label]="
          theme.themeApplique() === 'clair' ? 'Passer en thème sombre' : 'Passer en thème clair'
        "
      >
        <vh-icon [nom]="theme.themeApplique() === 'clair' ? 'lune' : 'soleil'" />
      </button>
    </header>

    <!-- La teinte de la section descend dans tout l'écran : pastille et point
         final du titre la prennent sans la connaître. -->
    <main class="contenu" id="contenu" [vhTeinte]="section()?.teinte ?? 'azur'">
      <router-outlet />
    </main>

    <vh-barre-basse [entrees]="entreesMobile()" [entreesPlus]="entreesPlus()" />
  </div>
</div>
